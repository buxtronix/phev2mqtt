name: lint

# golangci-lint with .golangci.yml: gofmt and the standard linters
# (errcheck, govet, ineffassign, staticcheck, unused). With the `pcap` build
# tag, so cmd/pcap.go is checked too; that needs cgo and libpcap.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: golangci-lint
        run: '"$(go env GOPATH)/bin/golangci-lint" run --build-tags pcap ./...'
